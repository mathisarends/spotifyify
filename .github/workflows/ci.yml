name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python }} --group dev --extra cli

      - name: Lint and formatting
        run: |
          uv run --no-sync ruff check spotifyify tests examples tools
          uv run --no-sync ruff format --check spotifyify tests examples tools

      - name: Typecheck public package
        run: uv run --no-sync pyright

      - name: Verify pinned schema
        run: uv run --no-sync python tools/generate_models.py --verify-only

      - name: Run tests
        run: uv run --no-sync pytest -q

      - name: Build distributions
        run: uv build

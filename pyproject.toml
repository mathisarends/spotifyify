[project]
name = "spotifyify"
version = "0.8.0"
description = "Async wrapper for spotipy with a focus on integration with MCP agents."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.16.0",
]

[project.scripts]
spotifyify = "spotifyify.cli:main"

[dependency-groups]
schema = ["datamodel-code-generator==0.88.0"]
dev = [
    "pytest>=8.4.1,<9",
    "pytest-asyncio>=1.1.0,<2",
    "pytest-mock>=3.14.1,<4",
    "pytest-cov>=6.2.1,<7",
    "ruff==0.14.13",
    "pre-commit>=4.3.0",
    "pyright>=1.1.414",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spotifyify*"]

[tool.uv]
package = true

[tool.pyright]
include = ["spotifyify", "tools"]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.setuptools.package-data]
spotifyify = ["py.typed"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

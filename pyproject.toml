[project]
name = "spotifyify"
version = "0.9.0"
description = "Typed async Spotify Web API client."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx2>=2.16.0,<3",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
]

[project.urls]
Repository = "https://github.com/mathisarends/spotifyify"
Issues = "https://github.com/mathisarends/spotifyify/issues"
Changelog = "https://github.com/mathisarends/spotifyify/blob/main/CHANGELOG.md"

[dependency-groups]
schema = ["datamodel-code-generator==0.88.0"]
dev = [
    "pytest>=8.4.1,<9",
    "pytest-asyncio>=1.1.0,<2",
    "pytest-mock>=3.14.1,<4",
    "pytest-cov>=6.2.1,<7",
    "ruff==0.14.13",
    "pre-commit>=4.3.0",
    "pyright>=1.1.414",
]
examples = [
    "mcp>=2,<3",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spotifyify*"]

[tool.uv]
package = true

[tool.pyright]
include = ["spotifyify", "tools", "examples"]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.setuptools.package-data]
spotifyify = ["py.typed"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
